name: supply-chain

# Free-tier GitHub-hosted check on a public repository.
on:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  # rustsec/audit-check reports through the API rather than the exit code: a
  # check run on workflow_dispatch, an issue on the weekly schedule. Without
  # these the audit completes, finds what it finds, and then fails to publish
  # that result with "Resource not accessible by integration".
  checks: write
  issues: write

concurrency:
  group: supply-chain
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # The action compiles cargo-audit, whose MSRV tracks current stable. Pin
      # the compiler here instead of inheriting whatever the runner image
      # happens to ship.
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust
