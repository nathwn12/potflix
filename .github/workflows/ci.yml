# nathwn12 house CI — stack: rust.
# Triggers on `pull_request` + `workflow_dispatch` (see `on:` below). The cargo
# steps mirror the local gate `tools\check.ps1` (clippy + release tests,
# `working-directory: rust` because the workspace manifest lives in `rust/`).
# Parity is deliberately absent: its corpora are gitignored, so the parity
# step fails closed in a fresh clone and runs only in the local gate.
name: ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --workspace --release --locked
        working-directory: rust
